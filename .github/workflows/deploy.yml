name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # ⚠️ 这个 `permissions` 是**白名单**：没列出来的权限一律是 none。
  #    `actions/deploy-pages` 的文档要求 `actions: read`（它要按 artifact id
  #    去取上传的产物）。v4 时不写也能跑，但那是在吃默认值的运气 ——
  #    显式写上，别依赖隐式行为。
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5 → v7：v6 把凭据从 .git/config 挪到单独文件（更安全），
        # v7 限制 fork PR 的检出（我们用 push 触发，不受影响）。
        uses: actions/checkout@v7

      - name: Setup Node
        # v5 → v7：加了 cache-primary-key / cache-matched-key 两个输出，
        # 其余是依赖升级与 ESM 迁移，无行为变更。
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 检查 i18n（静态）
        # 两道纯静态守卫，**放在 npm ci 之前**：它们零依赖
        # （只读 src/ 源码 + 直接 import src/data/i18n.js，那个文件自己不 import 任何东西），
        # 文案漏了就别浪费一次安装和构建。
        #
        #   check-i18n-parity  键位对齐 / 占位符一致 / 引用的键存在
        #   check-i18n-text    源码里有没有「该翻译但硬编码」的中文
        #
        # ⚠️ 第二道是 2026-10-02 补的 —— 前两道（parity + 渲染层）各有结构性盲区：
        #    parity 只扫 `t('…')` 的字面量（压根没调 t() 的它看不见），
        #    渲染层只扫正常渲染的页面（错误分支 / 冷门分支扫不到）。
        #    合起来看着像「i18n 已经守住了」，实际漏了约 25 条用户可见的中文。
        #
        # 两道都用退出码报错（1 = 有问题），所以这里不需要额外判断。
        run: npm run check:i18n

      - name: 静态守卫（CSS 变量 / 图标来源）
        # 同样**零依赖**（只读 src/ 源码），放在 npm ci 之前 —— 有问题别浪费一次安装。
        #
        #   check:css-vars   引用了不存在的 CSS 变量时，浏览器**不报错**，
        #                    整条声明被丢弃、样式静默失效。2026-10-14 实测撞上
        #                    （`--text_color` 真名是 `--main_text_color`），
        #                    顺手扫出 7 处 `--shadow-color`（真名 `--shadow_color`）
        #                    —— 那 7 个元素的 box-shadow 一直是空的。
        #   probe:icon-mode  三种图标来源（首字母 / 网站图标 / 自定义）的语义，
        #                    以及对**存量数据**的等价性（换渲染调用点不能改老数据的显示）。
        run: npm run check:css-vars && npm run probe:icon-mode

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Supabase 的 URL 和 anon key 是**构建期**注入的 —— Vite 的
        # import.meta.env.VITE_* 在打包时做静态替换，运行时不读环境变量。
        #
        # ⚠️ 这里用 vars（仓库变量）而不是 secrets：anon key 本来就要发给
        #    浏览器，不是秘密，放在 Variables 里更好排查。
        #    真正的秘密是 service_role key，那个绝不能进这个工作流。
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: 核对分享卡片标签（og / twitter）
        # 纯静态守卫，零依赖（只读 dist/index.html + 几个 node 内建模块）。
        #
        # 钉住的是一个**静默故障**：og:image 里写死的域名 + `/jerry-tools/`
        # 子路径，和 vite.config.js 的 REPO_NAME 是两处独立的地方 ——
        # 换仓库名时改了一处不会提醒另一处，症状是「站点好好的，
        # 分享出去的卡片却指着一张 404 的图」，肉眼看不出来。
        #
        # 判据不写死常量，而是**从产物反推实际 base** 再要求 og 自洽，
        # 所以换仓库名时这里不用改。
        run: npm run check:meta

      - name: 核对 Supabase 配置是否已注入
        # 没注入的话线上会静默退回纯本地模式（页面照样能开，
        # 只是登录、同步、分享全部不可用）—— 那种"看起来正常"的故障
        # 最难发现，所以在构建日志里明确点出来。
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning title=未注入 Supabase 配置::线上会退回纯本地模式（登录/同步/分享不可用）。请到 Settings → Secrets and variables → Actions → Variables 添加 VITE_SUPABASE_URL 与 VITE_SUPABASE_ANON_KEY。"
          else
            echo "✅ 已注入 Supabase：$VITE_SUPABASE_URL（anon key 长度 ${#VITE_SUPABASE_ANON_KEY}）"
            # 产物里必须能找到这个 URL。注意别拿域名当判据 —— 域名在别处也可能出现，
            # 要查完整 URL 本身。
            if grep -rqF "$VITE_SUPABASE_URL" dist/assets/; then
              echo "✅ 产物里已包含 Supabase URL"
            else
              echo "::error title=注入失败::dist/assets 里找不到 Supabase URL，Vite 的 env 替换可能没生效。"
              exit 1
            fi
          fi

      - name: Setup Pages
        # v5 → v6 只是升到 Node 24，无行为变更（v5 那个 breaking change
        # 是给 Next.js < 13.3 的，本项目是 Vite，用不到）。
        uses: actions/configure-pages@v6

      - name: Upload artifact
        # v4 → v5 只是把内部的 upload-artifact 升到 v7，无行为变更。
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v4 → v5 只是升到 Node 24.x，无行为变更。
        uses: actions/deploy-pages@v5
